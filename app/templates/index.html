<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #chatbox { width: 100%; height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        input[type="text"] { width: 80%; padding: 10px; }
        input[type="button"] { padding: 10px; }
    </style>
</head>
<body>
    <h1>🤖 AI Chatbot</h1>
    <div id="chatbox"></div>
    <input id="userInput" type="text" placeholder="Type a message..." />
    <input type="button" value="Send" onclick="sendMessage()" />

    <script>
        function sendMessage() {
            var userText = document.getElementById("userInput").value;
            var chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += "<div><b>You:</b> " + userText + "</div>";

            fetch("/get?msg=" + encodeURIComponent(userText))
                .then(res => res.json())
                .then(data => {
                    chatbox.innerHTML += "<div><b>Bot:</b> " + data.response + "</div>";
                    document.getElementById("userInput").value = "";
                    chatbox.scrollTop = chatbox.scrollHeight;
                });
        }
    </script>
</body>
</html>
